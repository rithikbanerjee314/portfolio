<!--
  Tab favicon for modern browsers (Next.js's `icon.svg` static-file
  convention — auto-detected, no code needed to wire it up). A circular
  badge with the site owner's initials, matching the "chip" look already
  used everywhere else on the page — the header's own initials, the
  station-label pills, the nav pills — dark navy fill, an accent-blue ring,
  bold light text. Colors are BG_DEEP/ACCENT_SIGNAL/SURFACE_LIGHT from
  components/world/palette.ts, hardcoded here since a plain static SVG can't
  import a TS module.

  Replaced an earlier low-poly-mountain design (see git history) at the
  user's request for something closer to the rest of the site's visual
  language. app/favicon.ico is regenerated to match by
  scratchpad/generate-favicon.mjs, for the legacy consumers that fetch
  /favicon.ico directly instead of reading the <link rel="icon"> tag this
  file produces — re-run that script by hand if this design changes, since
  the two aren't otherwise linked (that script hand-draws a small bitmap
  font instead of real text — see its own comment for why).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="14" fill="#050b17" stroke="#2f6bff" stroke-width="2" />
  <text
    x="16"
    y="16"
    dy=".34em"
    text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-weight="800"
    font-size="13.5"
    letter-spacing="-0.5"
    fill="#eaf2ff"
  >RB</text>
</svg>
